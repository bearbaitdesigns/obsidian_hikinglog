name: Release plugin

# Publish a release whose tag matches the version in manifest.json (e.g. 1.0.0) —
# from GitHub's "Draft a new release" page or by pushing the tag — and this
# workflow attaches the files BRAT and Obsidian need.
on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          tag="${GITHUB_REF_NAME#v}"   # accept 1.0.1 or v1.0.1
          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Create the release or attach files to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Hiking Log ${GITHUB_REF_NAME}" \
              main.js manifest.json styles.css
          fi
