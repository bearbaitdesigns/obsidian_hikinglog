name: Release plugin

# Push a tag that matches the version in manifest.json (e.g. 1.0.0) and this
# workflow publishes a GitHub release with the files BRAT and Obsidian need.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Hiking Log ${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css
